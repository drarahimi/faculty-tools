<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaTeX Formula & Equation Builder - Faculty Tools</title>

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- KaTeX for live equation rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- Common Library -->
    <script src="common.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 dark:bg-slate-950 text-gray-800 dark:text-slate-100 font-sans antialiased flex flex-col min-h-screen transition-colors duration-200">

    <!-- Header -->
    <header class="bg-white/90 dark:bg-slate-900/90 border-b border-gray-200 dark:border-slate-800 sticky top-0 z-50 shadow-sm backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-50 dark:bg-brand-950/40 text-brand-600 dark:text-brand-400 p-2 rounded-lg">
                    <i data-lucide="binary" class="h-5 w-5"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-gray-900 dark:text-white leading-tight">LaTeX Equation Builder</h1>
                    <p class="text-xs text-gray-500 dark:text-slate-400">Interactive live visual KaTeX equation editor with symbol palettes</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div id="header-quick-nav"></div>
                <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-gray-600 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 transition-colors bg-gray-100 dark:bg-slate-800 px-3 py-1.5 rounded-lg border border-gray-200 dark:border-slate-700">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                    <span>Dashboard</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">

        <!-- Visual Symbol Palette -->
        <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm space-y-3">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Symbol Palette (Click to Insert)</h2>
            <div class="flex flex-wrap gap-2 text-xs">
                <button onclick="insertSymbol('\\frac{a}{b}')" class="px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-slate-800 hover:bg-brand-50 hover:text-brand-600 transition-colors font-mono">Fraction \frac{a}{b}</button>
                <button onclick="insertSymbol('\\int_{a}^{b} x dx')" class="px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-slate-800 hover:bg-brand-50 hover:text-brand-600 transition-colors font-mono">Integral \int</button>
                <button onclick="insertSymbol('\\sum_{i=1}^{n}')" class="px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-slate-800 hover:bg-brand-50 hover:text-brand-600 transition-colors font-mono">Sum \sum</button>
                <button onclick="insertSymbol('\\sqrt{x}')" class="px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-slate-800 hover:bg-brand-50 hover:text-brand-600 transition-colors font-mono">Sqrt \sqrt{x}</button>
                <button onclick="insertSymbol('\\alpha')" class="px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-slate-800 hover:bg-brand-50 hover:text-brand-600 transition-colors font-mono">\alpha</button>
                <button onclick="insertSymbol('\\beta')" class="px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-slate-800 hover:bg-brand-50 hover:text-brand-600 transition-colors font-mono">\beta</button>
                <button onclick="insertSymbol('\\gamma')" class="px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-slate-800 hover:bg-brand-50 hover:text-brand-600 transition-colors font-mono">\gamma</button>
                <button onclick="insertSymbol('\\theta')" class="px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-slate-800 hover:bg-brand-50 hover:text-brand-600 transition-colors font-mono">\theta</button>
                <button onclick="insertSymbol('\\begin{bmatrix} a & b \\\\ c & d \\end{bmatrix}')" class="px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-slate-800 hover:bg-brand-50 hover:text-brand-600 transition-colors font-mono">2x2 Matrix</button>
                <button onclick="insertSymbol('\\lim_{x \\to \\infty}')" class="px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-slate-800 hover:bg-brand-50 hover:text-brand-600 transition-colors font-mono">Limit \lim</button>
                <button onclick="insertSymbol('\\partial x')" class="px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-slate-800 hover:bg-brand-50 hover:text-brand-600 transition-colors font-mono">\partial</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Code Input Column -->
            <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm flex flex-col gap-3">
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">LaTeX Equation Source</label>
                <textarea id="eqInput" rows="8" oninput="renderEq()" class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 leading-relaxed">\int_{-\infty}^{\infty} e^{-x^2} dx = \sqrt{\pi}</textarea>
                <div class="flex gap-2">
                    <button onclick="copyTeX()" class="flex-grow py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold transition-colors flex items-center justify-center gap-1.5">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                        Copy TeX
                    </button>
                </div>
            </div>

            <!-- KaTeX Preview Column -->
            <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm flex flex-col justify-between gap-4">
                <div>
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-4">Rendered Math Preview</label>
                    <div id="katexPreview" class="p-8 bg-slate-50 dark:bg-slate-950 rounded-xl border border-gray-200 dark:border-slate-800 text-center text-xl flex items-center justify-center min-h-[160px]">
                        <!-- Rendered KaTeX -->
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        function renderEq() {
            const tex = document.getElementById('eqInput').value;
            const container = document.getElementById('katexPreview');
            try {
                katex.render(tex, container, {
                    displayMode: true,
                    throwOnError: false
                });
            } catch (err) {
                container.textContent = 'Syntax error in TeX code';
            }
        }

        function insertSymbol(sym) {
            const textarea = document.getElementById('eqInput');
            textarea.value += ' ' + sym;
            renderEq();
        }

        function copyTeX() {
            const tex = document.getElementById('eqInput').value;
            navigator.clipboard.writeText(`\\[\n${tex}\n\\]`);
            if (window.showToast) window.showToast("Copied TeX code!");
        }

        renderEq();
    </script>
</body>
</html>
