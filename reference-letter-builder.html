<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Reference Letter Builder - Faculty Tools</title>

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Common Library -->
    <script src="common.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 dark:bg-slate-950 text-gray-800 dark:text-slate-100 font-sans antialiased flex flex-col min-h-screen transition-colors duration-200">

    <!-- Header -->
    <header class="bg-white/90 dark:bg-slate-900/90 border-b border-gray-200 dark:border-slate-800 sticky top-0 z-50 shadow-sm backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-50 dark:bg-brand-950/40 text-brand-600 dark:text-brand-400 p-2 rounded-lg">
                    <i data-lucide="file-check" class="h-5 w-5"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-gray-900 dark:text-white leading-tight">Student Reference Letter Builder</h1>
                    <p class="text-xs text-gray-500 dark:text-slate-400">Generate structured academic recommendation letters for grad school & scholarships</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div id="header-quick-nav"></div>
                <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-gray-600 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 transition-colors bg-gray-100 dark:bg-slate-800 px-3 py-1.5 rounded-lg border border-gray-200 dark:border-slate-700">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                    <span>Dashboard</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Left Column: Input Form -->
            <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm space-y-4">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Student & Application Details</h2>

                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div>
                        <label class="font-semibold text-gray-700 dark:text-slate-300 block mb-1">Student Name</label>
                        <input type="text" id="studName" value="Jane Doe" oninput="generateLetter()" class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100">
                    </div>
                    <div>
                        <label class="font-semibold text-gray-700 dark:text-slate-300 block mb-1">Target Application</label>
                        <select id="targetApp" onchange="generateLetter()" class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100">
                            <option value="Graduate School (M.Sc./Ph.D.)">Graduate School (M.Sc./Ph.D.)</option>
                            <option value="NSERC CGS Scholarship">NSERC CGS-M / CGS-D Scholarship</option>
                            <option value="Industry R&D Position">Industry R&D Position</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div>
                        <label class="font-semibold text-gray-700 dark:text-slate-300 block mb-1">Relationship / Role</label>
                        <input type="text" id="relation" value="Course Instructor & Research Supervisor" oninput="generateLetter()" class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100">
                    </div>
                    <div>
                        <label class="font-semibold text-gray-700 dark:text-slate-300 block mb-1">Course / Project Grade</label>
                        <input type="text" id="grade" value="A+ (Top 5% of class)" oninput="generateLetter()" class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100">
                    </div>
                </div>

                <div class="text-xs">
                    <label class="font-semibold text-gray-700 dark:text-slate-300 block mb-1">Key Strengths & Project Contributions</label>
                    <textarea id="strengths" rows="4" oninput="generateLetter()" class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500">Demonstrated exceptional analytical skills in control systems modeling. Developed an impressive capstone project on autonomous trajectory optimization with minimal supervision.</textarea>
                </div>
            </div>

            <!-- Right Column: Formatted Letter Preview -->
            <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm flex flex-col justify-between gap-4">
                <div>
                    <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Generated Recommendation Letter</h2>
                    <textarea id="letterText" rows="16" class="w-full p-4 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 rounded-xl border border-gray-200 dark:border-slate-800 text-xs font-sans leading-relaxed focus:outline-none"></textarea>
                </div>

                <div class="flex gap-2">
                    <button onclick="copyLetter()" class="flex-grow py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold shadow-sm transition-colors flex items-center justify-center gap-2">
                        <i data-lucide="copy" class="w-4 h-4"></i>
                        Copy Letter to Clipboard
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        function generateLetter() {
            const name = document.getElementById('studName').value;
            const app = document.getElementById('targetApp').value;
            const relation = document.getElementById('relation').value;
            const grade = document.getElementById('grade').value;
            const strengths = document.getElementById('strengths').value;

            const text = `To the Admissions & Selection Committee,

It is my distinct pleasure to write this letter of recommendation for ${name} in support of their application for ${app}. As a ${relation}, I have had the opportunity to closely observe ${name}'s academic performance, research capability, and dedication.

${name} performed exceptionally well under my supervision, earning a final standing of ${grade}. Throughout their time in my course and laboratory projects, they demonstrated an outstanding grasp of complex engineering concepts and problem-solving methodologies.

Specifically, ${strengths}

Given their technical rigor, intellectual curiosity, and strong work ethic, I recommend ${name} with my highest enthusiasm. I am confident they will make significant contributions to your program.

Sincerely,

Prof. A. Rahimi, Ph.D., P.Eng.
Department of Mechanical, Automotive & Materials Engineering
University of Windsor`;

            document.getElementById('letterText').value = text;
        }

        function copyLetter() {
            const text = document.getElementById('letterText').value;
            navigator.clipboard.writeText(text);
            if (window.showToast) window.showToast("Copied letter to clipboard!");
        }

        generateLetter();
    </script>
</body>
</html>
